name: Supabase keep-alive

# Prevents the Supabase free-tier project from pausing after 7 days of
# inactivity by sending one lightweight read request on a schedule.
# This runs on GitHub's servers, so it works even when nobody has the
# website open.
#
# ── SETUP (one time) ────────────────────────────────────────────────
# In your GitHub repo: Settings → Secrets and variables → Actions → New
# repository secret. Add these two secrets (same values as your .env):
#   SUPABASE_URL       = https://your-project.supabase.co
#   SUPABASE_ANON_KEY  = eyJ...your-anon-key
# ────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Runs at 06:00 UTC every 3 days. Well within the 7-day window even
    # if one run is skipped (GitHub occasionally delays scheduled jobs).
    - cron: "0 6 */3 * *"
  # Lets you trigger it manually from the Actions tab to test it.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY secret is missing."
            exit 1
          fi

          # A tiny authenticated read. Any query counts as activity and
          # resets the 7-day inactivity timer.
          HTTP_CODE=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/songs?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "HTTP status: $HTTP_CODE"
          cat /tmp/body.txt

          # 2xx = success. A paused project would fail here, which is the
          # signal that the schedule did not keep up.
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Keep-alive ping failed (HTTP $HTTP_CODE)."
            exit 1
          fi

          echo "Keep-alive ping succeeded."
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
